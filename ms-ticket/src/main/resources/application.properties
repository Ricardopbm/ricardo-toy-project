spring.application.name=ticket

server.port=8082

spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=ticket

spring.datasource.url=jdbc:postgresql://postgres-server:5432/cobaia
spring.datasource.username=postgres-user
spring.datasource.password=postgres-password

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_ticket
spring.flyway.schemas=ticket
spring.flyway.default-schema=ticket
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

app.notification.url=http://localhost:8081/api/v1/notification

services:
  postgres-server:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres-user
      POSTGRES_PASSWORD: postgres-password
      POSTGRES_DB: cobaia
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-api:
    profiles:
      - apps
    image: eclipse-temurin:21-jdk
    working_dir: /app
    command: sh ./gradlew bootRun --no-daemon
    mem_limit: 1g
    depends_on:
      - postgres-server
      - ms-ticket
      - ms-notification
    environment:
      APP_TICKET_URL: http://ms-ticket:8082/api/v1/tickets
      APP_NOTIFICATION_URL: http://ms-notification:8081/api/v1/notification
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Xmx512m
      JAVA_TOOL_OPTIONS: -Xmx512m
    ports:
      - "8080:8080"
    volumes:
      - ./user-api:/app
      - gradle_user_cache:/root/.gradle

  ms-notification:
    profiles:
      - apps
    image: eclipse-temurin:21-jdk
    working_dir: /app
    command: sh ./gradlew bootRun --no-daemon
    mem_limit: 768m
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Xmx384m
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - "8081:8081"
    volumes:
      - ./ms-notification:/app
      - gradle_notification_cache:/root/.gradle

  ms-ticket:
    profiles:
      - apps
    image: eclipse-temurin:21-jdk
    working_dir: /app
    command: sh ./gradlew bootRun --no-daemon
    mem_limit: 1g
    depends_on:
      - postgres-server
      - ms-notification
    environment:
      APP_NOTIFICATION_URL: http://ms-notification:8081/api/v1/notification
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Xmx512m
      JAVA_TOOL_OPTIONS: -Xmx512m
    ports:
      - "8082:8082"
    volumes:
      - ./ms-ticket:/app
      - gradle_ticket_cache:/root/.gradle

volumes:
  postgres_data:
  gradle_user_cache:
  gradle_notification_cache:
  gradle_ticket_cache:
